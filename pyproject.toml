[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonome-wagen"
version = "0.1.0"
description = "Library voor de software van project 'Autonome Wagen'"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Autonome Wagen Team" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
